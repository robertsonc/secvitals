# --- Category breadth pack -------------------------------------------------
# A modern SWG is graded on how many CATEGORIES it classifies correctly, so these are
# one benign request each to a canonical, unambiguous representative of a category a
# customer is likely to have a policy on. Same argv shape as the categories above, so
# the silent-drop classifier is unchanged. Only the genuinely awkward destinations
