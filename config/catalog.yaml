  expected_fire: "ET MALWARE — C2 beacon patterns (SIDs 2027793, 2016568)"
  talking_point: "Base64 beacon body + a tell-tale user-agent — the shape of real command-and-control."

# ---------------------------------------------------------------------------
# EdgeConnect Secure Web Services (BrightCloud WebCC) + IP reputation.
#
# WebCC denies by SILENTLY DROPPING the flow — there is NO block page. A deny is observed
# as a connect timeout / reset (curl rc 28/7/56 -> blocked); a completed response (rc 0,
# HTTP 2xx) is `allowed`. Environment failures (DNS/TLS: rc 6/35/60/…) are `error`, never
# a false blocked. PREREQUISITE: the category/reputation must be set to Deny in policy for
# a test to block; an `allowed` result most often means the policy isn't set.
# ---------------------------------------------------------------------------

- id: web-cat-gambling
  label: "Gambling — bet365.com"
  class: ns-webcc
  runner: curl
  commands:
    - ["curl", "-sS", "-A", "WebCC-Demo", "-o", "{devnull}", "-w", "%{http_code}|%{size_download}|%{url_effective}", "--connect-timeout", "6", "--max-time", "9", "https://www.bet365.com/"]
  flags: [needs_internet]
  severity: info
  threat_class: policy
  expected_fire: "WebCC category Gambling · Deny → timeout (silent drop)"
  talking_point: "Web-category filtering by hostname/SNI — no decryption needed."

- id: web-cat-social
