# Security Vitals — trigger catalog
# A FIXED, server-side allowlist. The UI sends only a trigger `id`; the runner builds
# argv from THIS file, never from client input. Optional params are validated against a
# per-trigger allowlist (none of these tmNIDS triggers take params).
#
# Class ns-ids = tmNIDS signatures against ECOS Suricata v7 (core: cached `tmNIDS -N`).
# Phase 3 will append the ns-webcc / ns-iprep triggers.
#
# Local classification (see CONFIRMED.md §5): the EC/Orchestrator dashboard is
# authoritative. Locally, `expected_on_allow: { rc: 0 }` means the trigger traffic was
# sent and not dropped inline (IDS detect-only => sent·allowed). A nonzero exit, with a
# control egress probe confirming general egress, reads as an inline drop (sent·blocked);
# if egress itself is down it reads as `error`, never a false `blocked`. Test 1 also
# checks the `uid=0` canary body for a precise allow signal.
#
# Fields: id, label, class, runner, argv, flags, severity, threat_class, expected_fire,
# talking_point, expected_on_allow, expected_on_block.
#
# `hits_live_suspect_hosts` (tests 4 and 5) reach REAL suspect infrastructure / live Tor
# nodes; they are disabled unless enable_live_suspect_hosts is set (see settings.yaml).
# Test 11's IP-lookup endpoints (ipify/ipinfo/icanhazip/ifconfig.io/checkip/ip-api) are
# mainstream echo services, so it is not gated.

- id: ns-uid
  label: "Linux UID (uid=0 root)"
  class: ns-ids
  runner: tmnids
  argv: ["tmNIDS", "-1"]
  flags: [needs_internet, needs_et_ruleset]
  severity: info
  threat_class: recon
  expected_fire: "SID 2100498 — GPL ATTACK_RESPONSE id check returned root"
  talking_point: "The classic IDS canary: command output (uid=0(root)) leaking in cleartext HTTP."
  expected_on_allow: { rc: 0, body_contains: "uid=0" }
  expected_on_block: { rc_nonzero: true }

