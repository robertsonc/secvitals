# ---------------------------------------------------------------------------
# Phase 3 — EdgeConnect Secure Web Services (BrightCloud WebCC) + IP reputation.
#
# WebCC denies by SILENTLY DROPPING the flow — there is NO block page. A deny is
# observed as a connect timeout / reset (curl rc 28/7/56 -> blocked); a completed
# response (rc 0, HTTP 2xx) is `allowed`. Environment failures (DNS/TLS: rc 6/35/60/…)
# are `error`, never a false blocked. PREREQUISITE: the category/reputation must be set
# to Deny in policy for a test to block; an `allowed` result most often means the policy
# isn't set, not that enforcement failed (surfaced in the UI).
#
# curl argv is FIXED here (the URL is not client input). -o /dev/null discards the body;
# -w writes "http_code|size|url" to stdout for the classifier.
# ---------------------------------------------------------------------------

- id: web-cat-gambling
  label: "Gambling — bet365.com"
  class: ns-webcc
  runner: curl
  argv: ["curl", "-sS", "-A", "WebCC-Demo", "-o", "/dev/null", "-w", "%{http_code}|%{size_download}|%{url_effective}", "--connect-timeout", "6", "--max-time", "9", "https://www.bet365.com/"]
  flags: [needs_internet]
  severity: info
  threat_class: policy
  expected_fire: "WebCC category Gambling · Deny → timeout (silent drop)"
  talking_point: "Web-category filtering by hostname/SNI — no decryption needed."

- id: web-cat-social
  label: "Social Networking — facebook.com"
