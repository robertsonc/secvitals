# Security Vitals — trigger catalog (native execution; no WSL)
#
# A FIXED, in-code allowlist. The UI acts on a trigger `id`; a command is NEVER built
# from free text. Each trigger runs one or more `commands` NATIVELY:
#   * curl  — the system curl (curl.exe on Windows 10 1803+); flags/exit codes are the
#             same on Windows and Linux, so the classifier is unchanged.
#   * dns   — a built-in stdlib UDP DNS query. Command form: ["dns", "<name>", "@<server>"].
#   * tcp   — a built-in stdlib TCP connect (+banner). Command form: ["tcp-connect", "<host>", "<port>"].
#   * iprep — the built-in IP-reputation probe (control probe + ratio).
#
# These reproduce EXACTLY what the corresponding tmNIDS test sends (3CORESec
# testmynids.org), so the same EdgeConnect / ECOS Suricata v7 signatures trip — but
# nothing downloads or executes a third-party binary. `{devnull}` is substituted to the
# OS null device at run time (Windows has no /dev/null).
#
# Local classification (see CONFIRMED.md §5): the EC / Orchestrator dashboard is
# authoritative. Locally, a completed request (curl rc 0 / a DNS response / a TCP connect)
# means the trigger traffic was SENT and not dropped inline (IDS detect-only => allowed).
# A drop (curl rc 28/7/56, or a probe timeout with the control egress probe still OK)
# reads as an inline block (sent·blocked); if egress itself is down it reads as `error`,
# never a false `blocked`. Multi-request triggers aggregate honestly (blocked only when
# every reachable request was dropped) and show the per-request breakdown.
#
# `hits_live_suspect_hosts` (ns-badcert, ns-tor, web-cat-p2p, ip-rep-tor) reach REAL
# suspect infrastructure / live Tor nodes; they are disabled unless
# enable_live_suspect_hosts is set (see settings.yaml).

# ---------------------------------------------------------------------------
# North–south IDS/IPS — the 15 tmNIDS signatures, reproduced natively.
# ---------------------------------------------------------------------------

- id: ns-uid
  label: "Linux UID (uid=0 root)"
  class: ns-ids
  runner: curl
  commands:
    - ["curl", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "http://testmynids.org/uid/index.html"]
  flags: [needs_internet, needs_et_ruleset]
  severity: info
  threat_class: recon
  expected_fire: "SID 2100498 — GPL ATTACK_RESPONSE id check returned root"
  talking_point: "The classic IDS canary: command output (uid=0(root)) leaking in cleartext HTTP."

- id: ns-basicauth
  label: "HTTP Basic Auth (root:root)"
  class: ns-ids
  runner: curl
  commands:
    - ["curl", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "-H", "Authorization: Basic cm9vdDpyb290", "http://testmynids.org"]
  flags: [needs_internet]
  severity: warn
  threat_class: policy
  expected_fire: "ET POLICY — Basic Auth base64 credentials"
  talking_point: "Credentials Base64'd, not encrypted — why Basic auth is watched."

- id: ns-malua
  label: "Malware User-Agents"
  class: ns-ids
  runner: curl
  commands:
    - ["curl", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "-A", "BlackSun", "http://testmynids.org"]
    - ["curl", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "-A", "HttpDownload", "http://testmynids.org"]
    - ["curl", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "-A", "agent", "http://testmynids.org"]
    - ["curl", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "-A", "MSIE", "http://testmynids.org"]
    - ["curl", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "-A", "JEDI-VCL", "http://testmynids.org"]
  flags: [needs_internet]
  severity: crit
  threat_class: malware
  expected_fire: "ET USER_AGENTS — suspicious UA (BlackSun, JEDI-VCL, HttpDownload…)"
  talking_point: "Malware often outs itself with a sloppy, hard-coded User-Agent."

- id: ns-badcert
  label: "Bad certificates & CAs"
  class: ns-ids
  runner: curl
  commands:
    - ["curl", "-k", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "https://edellroot.badssl.com/"]
    - ["curl", "-k", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "https://superfish.badssl.com/"]
    - ["curl", "-k", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "https://example.livehost.live/"]
    - ["curl", "-k", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "https://analiticsweb.site/"]
    - ["curl", "-k", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "https://beetrootculture.com/"]
    - ["curl", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "http://testmynids.org/content_for_tests/2021941.txt"]
  flags: [needs_internet, hits_live_suspect_hosts]
  severity: crit
  threat_class: malware
  expected_fire: "ET/ML TLS SIDs 2022134, 2020493, 2029345/6, 2033098, 2054198/200, 2021941 — bad/known-bad certs (curl -k so the handshake + SNI still cross the wire)"
  talking_point: "The ClientHello SNI + server certificate are what the sensor sees — validity doesn't matter, so we skip verification and let the handshake happen."

- id: ns-tor
  label: "Tor .onion DNS lookup"
  class: ns-ids
  runner: dns
  commands:
    - ["dns", "3wzn5p2yiumh7akj.onion", "@8.8.8.8"]
  flags: [needs_internet, hits_live_suspect_hosts]
  severity: warn
  threat_class: policy
  expected_fire: "ET POLICY — DNS query for a .onion (Tor) address"
  talking_point: "A .onion name in a DNS query is a strong Tor-usage signal. (Tor IP-reputation is the separate ip-rep-tor trigger.)"

