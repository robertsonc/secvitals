    - ["curl", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "-A", "HttpDownload", "http://testmynids.org"]
    - ["curl", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "-A", "agent", "http://testmynids.org"]
    - ["curl", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "-A", "MSIE", "http://testmynids.org"]
    - ["curl", "-s", "-S", "-o", "{devnull}", "-w", "%{http_code}|", "--connect-timeout", "6", "--max-time", "10", "-A", "JEDI-VCL", "http://testmynids.org"]
  flags: [needs_internet]
  severity: crit
  threat_class: malware
  expected_fire: "ET USER_AGENTS — suspicious UA (BlackSun, JEDI-VCL, HttpDownload…)"
  talking_point: "Malware often outs itself with a sloppy, hard-coded User-Agent."

