# Security Vitals — runtime settings
# Endpoints and toggles, kept separate from logic (see CONFIRMED.md §4). Edited by
# hand on the SE laptop; loaded once at startup. Anything security-relevant that a
# presenter might need to change lives here, not in code.

# Live suspect-infrastructure gate.
# Triggers flagged `hits_live_suspect_hosts` reach REAL suspect hosts / live Tor
# nodes (bad-cert hosts, thepiratebay, .onion / Tor relays). Disabled by default so the
# console can run on a customer-adjacent network without originating awkward traffic /
# SIEM entries. Flip to true only in a lab you control.
enable_live_suspect_hosts: false

run:
  default_timeout_s: 30
  # Control egress probe — how the console tells a genuine inline drop (blocked) from a
  # broken environment (error) for the native dns / tcp probes. Before deciding such a
  # probe was BLOCKED, it confirms general egress by TCP-connecting to this known-good
  # host; if the control fails, the result is `error`, never a false `blocked`. (curl
  # triggers don't need this — curl's own exit code separates a drop from an env failure.)
  # Set control_host to "" to disable.
  control_host: "1.1.1.1"
  control_port: 443

  # A SINGLE control host is a single point of failure for the whole blocked-vs-error
  # decision: if the customer's policy happens to deny 1.1.1.1, every native probe drop
  # degrades to `error` and real blocks are masked. List several and egress counts as up
  # if ANY answers. `kind` is tcp (default) or dns, so a DNS trigger can be checked with
  # a DNS control — a network that permits DNS while denying TCP/443 would otherwise
  # produce a false `error`. Falls back to control_host/control_port above when unset.
  control_endpoints:
    - {host: "1.1.1.1", port: 443, kind: tcp}
    - {host: "9.9.9.9", port: 443, kind: tcp}
    - {host: "8.8.8.8", port: 53, kind: dns}

  # Refuse to start unless config/catalog.yaml carries a valid signature. Default false
  # so existing unsigned installs keep working; the status is always reported either way.
  # Sign with tools/sign_catalog.sh. Also available as --strict-catalog.
  strict_catalog: false

  # ERROR-ONLY origin failover: origin host -> alternate host, applied ONLY when a
  # request honestly ERRORS (DNS/TLS failure) and NEVER past a blocked or allowed result.
  # EMPTY BY DEFAULT, deliberately. It preserves signal count when an origin is down, but
  # it also changes what is on the wire: an alternate that does not serve the same
  # content can turn a real signal into a benign request that trips nothing. Enable it
  # only with an alternate you control and have checked. Any result reached this way is
  # marked ORIGIN FAILOVER in the details.
  origin_failover: {}

webcc:
  # IP-reputation (ns-iprep) probes live Tor relays. The node list is cached with a TTL
  # (not refetched per click). Before probing, a control egress probe (run.control_host)
  # confirms egress; if it fails the whole test is reported `invalid`, and node results
  # are reported as a ratio ("4 of 6 blocked"), never a single verdict.
  tor_list_url: "https://raw.githubusercontent.com/SecOps-Institute/Tor-IP-Addresses/master/tor-nodes.lst"
  tor_list_ttl_s: 3600
  ip_rep_sample: 6                # probe the first N well-formed relay IPs
  node_probe_timeout_s: 5

update:
  # Pinned, non-overridable release source. The updater fails CLOSED without a valid
  # signature over the manifest (see docs/UPDATE_SECURITY.md). This URL is informational
  # for operators; the code constant is authoritative.
  manifest_url: "https://github.com/robertsonc/secvitals/releases/latest/download/manifest.json"
  check_on_start: false
